name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build backend/dotnet/src/Api/Api.csproj --configuration Release
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: agents
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - working-directory: agents
        run: pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: frontend/web
        run: npm install
      - working-directory: frontend/web
        run: npm run lint
      - working-directory: frontend/web
        run: npm run build
