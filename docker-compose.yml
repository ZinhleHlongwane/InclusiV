services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform_user} -d ${POSTGRES_DB:-financial_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend/dotnet
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-financial_platform};Username=${POSTGRES_USER:-platform_user};Password=${POSTGRES_PASSWORD:-change-me-local-only}
      ApplyMigrationsOnStartup: "true"
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
  agents:
    build: ./agents
    environment:
      PORT: "8000"
    ports: ["8000:8000"]
  frontend:
    build: ./frontend/web
    ports: ["3000:3000"]
    depends_on: [api, agents]
volumes:
  postgres_data:
