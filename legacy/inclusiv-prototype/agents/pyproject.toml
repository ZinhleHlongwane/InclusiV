[project]
name = "inclusiv-agents"
version = "0.1.0"
description = "A2A agent services for the InclusiV financial-inclusion prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.2.6",
    "click>=8.1.8",
    "httpx>=0.28.1",
    "langchain-google-genai>=2.1.4",
    "langgraph>=0.4.1",
    "openai>=1.93.0",
    "pydantic>=2.11.4",
    "requests>=2.31.0",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.34.2",
    "starlette>=0.37.2",
    "sse-starlette>=1.6.5",
    # Agno AGI Framework dependencies
    "agno>=1.8.0",
    "lancedb>=0.25.0",
    "sqlalchemy>=2.0.0",
    # MCP Framework dependencies for Research Agent
    "langchain-openai>=0.1.0",
    "mcp-use>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
